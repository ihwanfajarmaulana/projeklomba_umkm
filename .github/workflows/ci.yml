# CI — gerbang kualitas sebelum masuk main.
#
# Latar: awal Okt 2026 ada resolusi konflik rusak (syntax error di file admin)
# yang tidak tertangkap sampai dijalankan manual di lokal. Workflow ini
# menjalankan lint + typecheck + build di lingkungan bersih di setiap push dan
# pull request, supaya kerusakan seperti itu ketahuan sebelum masuk cabang utama.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Satu lomba per ref: push berturut-turut membatalkan run lama yang belum selesai.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    # Supabase palsu untuk seluruh job: build maupun smoke tidak boleh butuh
    # secret asli. Semua rute force-dynamic, jadi tidak ada data yang diambil.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-key
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # `next typegen` wajib jalan lebih dulu: tipe rute (PageProps<"/...">)
        # digenerate Next ke .next — di checkout bersih (CI) belum ada, jadi
        # `tsc --noEmit` polos akan gagal "Cannot find name 'PageProps'".
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Smoke test level-routing saja: 404, pengalihan rute terproteksi, dan
      # halaman publik tanpa data. Bagian berdata & per-peran dilewati karena CI
      # tidak menjalankan Supabase sungguhan (env di atas hanya palsu).
      - name: Smoke test (routing)
        run: |
          npm run start &
          npm run smoke
        env:
          SMOKE_NO_DATA: "1"
          SMOKE_NO_AUTH: "1"
